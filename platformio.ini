[platformio]
default_envs = esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor@^1.1
build_flags =
    -D MICROCLAW_NODE_ID=\"microclaw-001\"
    -D MICROCLAW_WIFI_SSID=\"\"
    -D MICROCLAW_WIFI_PASSWORD=\"\"
    -D MICROCLAW_MQTT_HOST=\"\"
    -D MICROCLAW_MQTT_PORT=1883
    -D MICROCLAW_MQTT_TOPIC=\"clawland/microclaw/status\"
    -D MICROCLAW_REPORT_INTERVAL_MS=10000UL
    -D MICROCLAW_MQTT_RETRY_MS=5000UL
    -D MICROCLAW_ENABLE_OTA=0
    -D MICROCLAW_OTA_PASSWORD=\"\"
    -D MICROCLAW_ENABLE_DEEP_SLEEP=0
    -D MICROCLAW_SLEEP_SECONDS=300UL
    -D MICROCLAW_BATTERY_DIVIDER_RATIO=2.0f
    -D MICROCLAW_LOW_BATTERY_MV=3300

[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D MICROCLAW_BOARD_NAME=\"esp32dev\"
    -D MICROCLAW_ANALOG_PIN=34
    -D MICROCLAW_DHT_PIN=4
    -D MICROCLAW_BATTERY_PIN=35

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D MICROCLAW_BOARD_NAME=\"esp32-c3-devkitm-1\"
    -D MICROCLAW_ANALOG_PIN=2
    -D MICROCLAW_DHT_PIN=4
    -D MICROCLAW_BATTERY_PIN=0
