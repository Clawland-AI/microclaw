
[platformio]
default_envs = esp32c3

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_ESP32C3_DEV
    -D CONFIG_IDF_TARGET_ESP32C3
