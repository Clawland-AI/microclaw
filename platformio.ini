[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor@^1.1
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ; Override these per deployment, e.g. -DMICROCLAW_WIFI_SSID=\"lab-wifi\"
    -DMICROCLAW_WAKE_INTERVAL_SECONDS=60
    -DMICROCLAW_DEEP_SLEEP_ENABLED=0
