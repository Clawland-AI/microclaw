[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor@^1.1
build_flags =
    -D MICROCLAW_NODE_ID=\"microclaw-esp32c3-001\"
    -D MICROCLAW_WIFI_SSID=\"CHANGE_ME\"
    -D MICROCLAW_WIFI_PASSWORD=\"CHANGE_ME\"
    -D MICROCLAW_MQTT_HOST=\"192.168.1.10\"
    -D MICROCLAW_MQTT_PORT=1883
    -D MICROCLAW_DHT_PIN=4
    -D MICROCLAW_BATTERY_PIN=0
    -D MICROCLAW_LOW_BATTERY_MV=3300
    -D MICROCLAW_SLEEP_SECONDS=300
    -D MICROCLAW_OTA_WINDOW_SECONDS=20

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor@^1.1
build_flags =
    -D MICROCLAW_NODE_ID=\"microclaw-esp32-001\"
    -D MICROCLAW_WIFI_SSID=\"CHANGE_ME\"
    -D MICROCLAW_WIFI_PASSWORD=\"CHANGE_ME\"
    -D MICROCLAW_MQTT_HOST=\"192.168.1.10\"
    -D MICROCLAW_MQTT_PORT=1883
    -D MICROCLAW_DHT_PIN=4
    -D MICROCLAW_BATTERY_PIN=34
    -D MICROCLAW_LOW_BATTERY_MV=3300
    -D MICROCLAW_SLEEP_SECONDS=300
    -D MICROCLAW_OTA_WINDOW_SECONDS=20
